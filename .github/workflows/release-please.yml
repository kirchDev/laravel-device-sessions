# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# A Packagist package: the tag is what Composer resolves, so nothing is
# published from here.

name: Release Please

on:
  push:
    branches:
      - main

jobs:
  release-please:
    name: Release Please
    permissions:
      contents: write
      pull-requests: write
    uses: kirchDev/workflows/.github/workflows/_release-please.yml@c32ca1bf9458d159f6ef3481eee7dde8186a22be # v0.19.3
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
